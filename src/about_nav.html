<html lang="en">
<head>

  <style>
   body {
        margin: 0;
        background: var(--ink);
        font-family: 'DM Sans', sans-serif;
        overflow-x: hidden;
    }

    img {
        max-width: 100%;
    }

    .contact-bar {
        min-height: 44px;
        box-sizing: border-box;
        background: #000;
    }

    .contact-bar h4 {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0;
        white-space: nowrap;
    }

    .contact-bar i {
        color: var(--lime);
        font-size: 0.8rem;
    }

    .main-nav {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
    }

    .nav-inner {
        width: min(100% - 3rem, 1280px);
        margin: 0 auto;
    }

    .nav-logo {
        width: auto;
        max-width: 150px;
    }

    .nav-links a {
        position: relative;
        transition: color 180ms ease;
    }

    .nav-links a::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: -0.45rem;
        left: 0;
        height: 2px;
        background: var(--lime);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 180ms ease;
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
        transform: scaleX(1);
        transform-origin: left;
    }

    header {
        position: relative;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        width: 100%;
    }

    #navbar.is-sticky {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: white !important;
    }
   
    @media (max-width: 760px) {

        .contact-bar {
            justify-content: center;
            gap: 0.85rem;
            padding-inline: 1rem;
            font-size: 0.68rem;
        }

        .nav-inner {
            width: calc(100% - 2rem);
            flex-wrap: wrap;
            gap: 0.65rem 1rem;
        }

        .nav-logo {
            max-width: 112px;
            height: auto;
        }

        .nav-links {
            width: 100%;
            justify-content: space-between;
            gap: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
        }

        .nav-links a {
            font-size: 0.76rem;
        }

        #navbar.is-sticky .nav-links {
            border-color: rgba(16, 39, 27, 0.12);
        }

        .hero-content {
            align-items: center;
            padding: 9rem 1.5rem 5rem;
        }

        .hero-description {
            min-height: 190px;
        }

            .hero {
        min-height: min(860px, 100svh);
        background: #183c28;
    }

    .hero::after {
        background: linear-gradient(90deg, rgba(7, 28, 16, 0.78), rgba(7, 28, 16, 0.34) 65%, rgba(7, 28, 16, 0.5));
    }


    .hero-content>div {
        width: min(1000px, 100%);
    }

        .phrase {
            font-size: clamp(1.15rem, 6.2vw, 3.6rem);
        }

        .logo-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.85rem;
        }

        .logo-tile {
            min-height: 96px;
            padding: 0.75rem;
        }

        .logo-tile img {
            height: 58px;
        }

        .partner-window {
            mask-image: none;
        }

    }


    </style>

</head>
<body>
    <header>

    <div class="contact-bar w-full bg-black text-white">

        <div
            class="mx-auto flex w-full max-w-7xl items-center justify-end gap-4 px-4 py-0.5 text-xs font-medium sm:gap-4 sm:px-1 lg:gap-4 lg:px-6 lg:text-sm sm:justify-end pt-3">

            <a href="mailto:info@qelatechnologies.co.tz"
                class="flex items-center gap-2 whitespace-nowrap transition hover:text-[#dfa21f]">

                <i class="fa-solid fa-envelope text-[#dfa21f]"></i>

                <span>info@qelatechnologies.co.tz</span>

            </a>

            <a href="tel:+255752686686"
                class="flex items-center gap-2 whitespace-nowrap transition hover:text-[#dfa21f]">

                <i class="fa-solid fa-phone text-[#dfa21f]"></i>

                <span>+255 718 352 944</span>

            </a>

        </div>

    </div>

    <nav id="navbar" class="w-full p-4">

        <div class="nav-inner flex items-center justify-between gap-8">

            <img src="./resource/image/qela_logo.png" class="nav-logo h-16" alt="QELA logo">

            <div class="hidden md:block">

                <div class="nav-links flex items-center gap-7 text-base font-semibold text-yellow-400 md:text-lg">

                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Products</a>
                    <a href="#">Industry</a>
                    <a href="#">Resource</a>

                </div>

            </div>

            <button id="menuBtn" class="md:hidden text-yellow-400 text-2xl">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </nav>

    <div id="sidebar"
        class="fixed top-0 right-0 z-50 h-full w-72 bg-gray-900 translate-x-full transition-transform duration-300 md:hidden">

        <div class="flex justify-end p-5">

            <button id="closeBtn" class="text-white text-2xl">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="flex flex-col gap-6 px-8 py-5 text-lg font-semibold text-yellow-400">

            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Products</a>
            <a href="#">Industry</a>
            <a href="#">Resource</a>

        </div>

    </div>

</header>
  
    <section class="hero w-full overflow-hidden text-white">

         <div class="h-80 bg-[url('./resource/image/about.jpg')] 
            bg-cover bg-center flex items-center justify-center">

        <p class="font-bold text-center text-2xl text-yellow-400 z-[50]">Home/About</p>


    </section>



     <script>

    document.addEventListener("DOMContentLoaded", function () {

        const menuBtn =
            document.getElementById("menuBtn");

        const closeBtn =
            document.getElementById("closeBtn");

        const sidebar =
            document.getElementById("sidebar");

        if (menuBtn && closeBtn && sidebar) {

            function openSidebar() {

                sidebar.classList.remove(
                    "translate-x-full"
                );

                sidebar.classList.add(
                    "translate-x-0"
                );

                document.body.classList.add(
                    "overflow-hidden"
                );

            }

            function closeSidebar() {

                sidebar.classList.remove(
                    "translate-x-0"
                );

                sidebar.classList.add(
                    "translate-x-full"
                );

                document.body.classList.remove(
                    "overflow-hidden"
                );

            }

            menuBtn.addEventListener(
                "click",
                function () {
                    openSidebar();
                }
            );

            closeBtn.addEventListener(
                "click",
                function () {
                    closeSidebar();
                }
            );

            const sidebarLinks =
                sidebar.querySelectorAll("a");

            sidebarLinks.forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            closeSidebar();

                        }
                    );

                }
            );

            document.addEventListener(
                "keydown",
                function (event) {

                    if (event.key === "Escape") {
                        closeSidebar();
                    }

                }
            );

            window.addEventListener(
                "resize",
                function () {

                    if (window.innerWidth >= 768) {
                        closeSidebar();
                    }

                }
            );

        }

        const navbar =
            document.getElementById("navbar");

        const contactBar =
            document.querySelector(".contact-bar");

        if (navbar) {

            function handleNavbarScroll() {

                const triggerPoint =
                    contactBar
                        ? contactBar.offsetHeight
                        : 44;

                if (window.scrollY > triggerPoint) {

                    navbar.classList.add(
                        "is-sticky"
                    );

                } else {

                    navbar.classList.remove(
                        "is-sticky"
                    );

                }

            }

            window.addEventListener(
                "scroll",
                handleNavbarScroll
            );

            handleNavbarScroll();

        }

        const faqItems =
            document.querySelectorAll(
                ".faq-item"
            );

        faqItems.forEach(
            function (item) {

                const question =
                    item.querySelector(
                        ".faq-question"
                    );

                const answer =
                    item.querySelector(
                        ".faq-answer"
                    );

                const icon =
                    item.querySelector(
                        ".faq-icon"
                    );

                if (
                    !question ||
                    !answer ||
                    !icon
                ) {
                    return;
                }

                question.addEventListener(
                    "click",
                    function () {

                        const isOpen =
                            item.classList.contains(
                                "active"
                            );

                        faqItems.forEach(
                            function (otherItem) {

                                const otherAnswer =
                                    otherItem.querySelector(
                                        ".faq-answer"
                                    );

                                const otherIcon =
                                    otherItem.querySelector(
                                        ".faq-icon"
                                    );

                                otherItem.classList.remove(
                                    "active"
                                );

                                if (otherAnswer) {

                                    otherAnswer.style.maxHeight =
                                        "0px";

                                    otherAnswer.style.opacity =
                                        "0";

                                }

                                if (otherIcon) {

                                    otherIcon.textContent =
                                        "+";

                                }

                            }
                        );

                        if (!isOpen) {

                            item.classList.add(
                                "active"
                            );

                            answer.style.maxHeight =
                                answer.scrollHeight + "px";

                            answer.style.opacity =
                                "1";

                            icon.textContent =
                                "−";

                        }

                    }
                );

            }
        );

        const statistics =
            document.querySelector(
                "[data-statistics]"
            );

        const statisticsItems =
            document.querySelectorAll(
                ".statistics-item"
            );

        if (
            statistics &&
            statisticsItems.length > 0
        ) {

            const prefersReducedMotion =
                window.matchMedia(
                    "(prefers-reduced-motion: reduce)"
                ).matches;

            function animateCounter(item) {

                const counter =
                    item.querySelector(
                        "[data-counter]"
                    );

                if (!counter) {
                    return;
                }

                const targetAttribute =
                    item.getAttribute(
                        "data-target"
                    );

                const target =
                    Number(targetAttribute);

                if (!Number.isFinite(target)) {

                    console.error(
                        "Invalid statistics data-target:",
                        targetAttribute,
                        item
                    );

                    counter.textContent =
                        "0";

                    return;

                }

                const displayAttribute =
                    item.getAttribute(
                        "data-display"
                    );

                let displayNumber =
                    Number(displayAttribute);

                if (
                    !Number.isFinite(
                        displayNumber
                    )
                ) {

                    displayNumber =
                        target;

                }

                if (prefersReducedMotion) {

                    counter.textContent =
                        displayNumber.toLocaleString();

                    return;

                }

                const startTime =
                    performance.now();

                const duration =
                    1400;

                function updateCounter(
                    currentTime
                ) {

                    const elapsed =
                        currentTime -
                        startTime;

                    const progress =
                        Math.min(
                            elapsed / duration,
                            1
                        );

                    const easedProgress =
                        1 -
                        Math.pow(
                            1 - progress,
                            3
                        );

                    const currentValue =
                        Math.floor(
                            target *
                            easedProgress
                        );

                    counter.textContent =
                        currentValue.toLocaleString();

                    if (progress < 1) {

                        requestAnimationFrame(
                            updateCounter
                        );

                    } else {

                        counter.textContent =
                            displayNumber.toLocaleString();

                    }

                }

                requestAnimationFrame(
                    updateCounter
                );

            }

            let statisticsAnimated =
                false;

            const statisticsObserver =
                new IntersectionObserver(
                    function (
                        entries,
                        observer
                    ) {

                        entries.forEach(
                            function (entry) {

                                if (
                                    !entry.isIntersecting ||
                                    statisticsAnimated
                                ) {
                                    return;
                                }

                                statisticsAnimated =
                                    true;

                                statisticsItems.forEach(
                                    function (item) {

                                        item.classList.add(
                                            "is-visible"
                                        );

                                        animateCounter(
                                            item
                                        );

                                    }
                                );

                                observer.unobserve(
                                    entry.target
                                );

                            }
                        );

                    },
                    {
                        threshold: 0.25
                    }
                );

            statisticsObserver.observe(
                statistics
            );

        }

    });

</script>


</body>
</html>
