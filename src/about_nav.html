<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="shortcut icon" href="./resource/favico.ico" type="image/x-icon">

    <link href="./output.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link
       href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
       rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

  <style>
   body {
        margin: 0;
        background: var(--ink);
        font-family: 'DM Sans', sans-serif;
        overflow-x: hidden;
    }

    img {
        max-width: 100%;
    }

    .contact-bar {
        min-height: 44px;
        box-sizing: border-box;
        background: #000;
    }

    .contact-bar h4 {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        margin: 0;
        white-space: nowrap;
    }

    .contact-bar i {
        color: var(--lime);
        font-size: 0.8rem;
    }

    .main-nav {
        background: transparent;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
    }

    .nav-inner {
        width: min(100% - 3rem, 1280px);
        margin: 0 auto;
    }

    .nav-logo {
        width: auto;
        max-width: 150px;
    }

    .nav-links a {
        position: relative;
        transition: color 180ms ease;
    }

    .nav-links a::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: -0.45rem;
        left: 0;
        height: 2px;
        background: var(--lime);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 180ms ease;
    }

    .nav-links a:hover::after,
    .nav-links a:focus-visible::after {
        transform: scaleX(1);
        transform-origin: left;
    }

    header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        width: 100%;
    }

    #navbar.is-sticky {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: white !important;
    }
   
    @media (max-width: 760px) {

        .contact-bar {
            justify-content: center;
            gap: 0.85rem;
            padding-inline: 1rem;
            font-size: 0.68rem;
        }

        .nav-inner {
            width: calc(100% - 2rem);
            flex-wrap: wrap;
            gap: 0.65rem 1rem;
        }

        .nav-logo {
            max-width: 112px;
            height: auto;
        }

        .nav-links {
            width: 100%;
            justify-content: space-between;
            gap: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.22);
        }

        .nav-links a {
            font-size: 0.76rem;
        }

        #navbar.is-sticky .nav-links {
            border-color: rgba(16, 39, 27, 0.12);
        }

        .hero-content {
            align-items: center;
            padding: 9rem 1.5rem 5rem;
        }

        .hero-description {
            min-height: 190px;
        }

            .hero {
        min-height: min(860px, 100svh);
        background: #183c28;
    }

    .hero::after {
        background: linear-gradient(90deg, rgba(7, 28, 16, 0.78), rgba(7, 28, 16, 0.34) 65%, rgba(7, 28, 16, 0.5));
    }


    .hero-content>div {
        width: min(1000px, 100%);
    }

        .phrase {
            font-size: clamp(1.15rem, 6.2vw, 3.6rem);
        }

        .logo-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.85rem;
        }

        .logo-tile {
            min-height: 96px;
            padding: 0.75rem;
        }

        .logo-tile img {
            height: 58px;
        }

        .partner-window {
            mask-image: none;
        }

    }


    </style>

</head>
<body>
    <header>

    <div class="contact-bar w-full bg-black text-white">

        <div
            class="mx-auto flex w-full max-w-7xl items-center justify-end gap-4 px-4 py-0.5 text-xs font-medium sm:gap-4 sm:px-1 lg:gap-4 lg:px-6 lg:text-sm sm:justify-end pt-3">

            <a href="mailto:info@qelatechnologies.co.tz"
                class="flex items-center gap-2 whitespace-nowrap transition hover:text-[#dfa21f]">

                <i class="fa-solid fa-envelope text-[#dfa21f]"></i>

                <span>info@qelatechnologies.co.tz</span>

            </a>

            <a href="tel:+255752686686"
                class="flex items-center gap-2 whitespace-nowrap transition hover:text-[#dfa21f]">

                <i class="fa-solid fa-phone text-[#dfa21f]"></i>

                <span>+255 718 352 944</span>

            </a>

        </div>

    </div>

    <nav id="navbar" class="w-full p-4">

        <div class="nav-inner flex items-center justify-between gap-8">

            <img src="./resource/image/qela_logo.png" class="nav-logo h-16" alt="QELA logo">

            <div class="hidden md:block">

                <div class="nav-links flex items-center gap-7 text-base font-semibold text-yellow-400 md:text-lg">

                    <a href="#">Home</a>
                    <a href="#">About</a>
                    <a href="#">Products</a>
                    <a href="#">Industry</a>
                    <a href="#">Resource</a>

                </div>

            </div>

            <button id="menuBtn" class="md:hidden text-yellow-400 text-2xl">

                <i class="fa-solid fa-bars"></i>

            </button>

        </div>

    </nav>

    <div id="sidebar"
        class="fixed top-0 right-0 z-50 h-full w-72 bg-gray-900 translate-x-full transition-transform duration-300 md:hidden">

        <div class="flex justify-end p-5">

            <button id="closeBtn" class="text-white text-2xl">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <div class="flex flex-col gap-6 px-8 py-5 text-lg font-semibold text-yellow-400">

            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Products</a>
            <a href="#">Industry</a>
            <a href="#">Resource</a>

        </div>

    </div>

</header>
  
    <section class="hero w-full overflow-hidden text-white">
       <img src="./resource/image/farmer1.jpg" alt="" 
       class="object-cover w-full h-[400px] py-5">

    </section>


</body>
</html>
