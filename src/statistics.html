<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Qela Agritech impact statistics.">

    <title>Qela Statistics</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <style>

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
        }


        .statistics-item {
            opacity: 0;
            transform: translateY(25px);

            transition:
                opacity 700ms ease,
                transform 700ms ease;
        }


        .statistics-item.is-visible {
            opacity: 1;
            transform: translateY(0);
        }


        .statistics-item:nth-child(2) {
            transition-delay: 100ms;
        }


        .statistics-item:nth-child(3) {
            transition-delay: 200ms;
        }


        .statistics-item:nth-child(4) {
            transition-delay: 300ms;
        }


        /* BIG WHITE ICONS */

        .stat-icon {
            width: 58px;
            height: 58px;

            stroke: #ffffff;
            stroke-width: 2.2;

            fill: none;
        }


        @media (max-width: 1023px) {

            .statistics-item:nth-child(2),
            .statistics-item:nth-child(4) {
                border-right: none;
            }

        }


        @media (prefers-reduced-motion: reduce) {

            .statistics-item {
                opacity: 1;
                transform: none;
                transition: none;
            }

        }

    </style>

</head>


<body>


    <section
        class="relative isolate min-h-[420px] overflow-hidden sm:min-h-[450px] !text-lg"
        aria-label="Qela Agritech statistics">


        <!-- Background -->

        <div class="absolute inset-0">

            <img
                src="./resource/image/statistics.jpg"
                alt="Farmer working in an agricultural field"
                class="h-full w-full object-cover object-center">

        </div>


        <!-- Original overlays -->

        <div class="absolute inset-0 bg-green-900/30"></div>

        <div class="absolute inset-0 bg-green-600/55"></div>


        <div
            class="relative z-10 flex min-h-[420px] items-center sm:min-h-[450px]">


            <div
                class="mx-auto w-full max-w-7xl px-5 sm:px-8 lg:px-10">


                <div
                    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4"
                    data-statistics>


                    <!-- FARMERS -->

                    <article
                        class="statistics-item flex min-h-[190px] flex-col items-center justify-center px-6 py-8 text-center lg:border-r lg:border-white/25"
                        data-target="350000"
                        data-display="350000">


                        <!-- BIG BOLD WHITE NUMBER -->

                        <div class="text-5xl font-extrabold tracking-tight text-white sm:text-6xl">

                            <span data-counter>0</span><span class="text-white">+</span>

                        </div>


                        <!-- BIG WHITE ICON -->

                        <div class="mt-5">

                            <svg
                                class="stat-icon"
                                viewBox="0 0 48 48"
                                aria-hidden="true">

                                <circle cx="24" cy="13" r="5" />

                                <path d="M14 36c0-6 4-10 10-10s10 4 10 10" />

                                <circle cx="10" cy="19" r="4" />

                                <path d="M2 36c0-5 3-8 8-8" />

                                <circle cx="38" cy="19" r="4" />

                                <path d="M46 36c0-5-3-8-8-8" />

                            </svg>

                        </div>


                        <!-- CLEAN CLASSIC LABEL -->

                        <p class="mt-5 text-lg font-semibold tracking-[0.08em] text-white">
                            Farmers
                        </p>


                    </article>



                    <!-- FARMS -->

                    <article
                        class="statistics-item flex min-h-[190px] flex-col items-center justify-center border-t border-white/25 px-6 py-8 text-center md:border-r lg:border-t-0"
                        data-target="1000"
                        data-display="1000">


                        <!-- BIG BOLD WHITE NUMBER -->

                        <div class="text-5xl font-extrabold tracking-tight text-white sm:text-6xl">

                            <span data-counter>0</span><span class="text-white">+</span>

                        </div>


                        <!-- BIG WHITE ICON -->

                        <div class="mt-5">

                            <svg
                                class="stat-icon"
                                viewBox="0 0 48 48"
                                aria-hidden="true">

                                <path d="M5 9l12-4 14 4 12-4v34l-12 4-14-4-12 4z" />

                                <path d="M17 5v34" />

                                <path d="M31 9v34" />

                                <path d="M24 15c-4 0-7 3-7 7 0 5 7 12 7 12s7-7 7-12c0-4-3-7-7-7z" />

                                <circle cx="24" cy="22" r="2" />

                            </svg>

                        </div>


                        <!-- CLEAN CLASSIC LABEL -->

                        <p class="mt-5 text-lg font-semibold tracking-[0.08em] text-white">
                            Hectares of Farms
                        </p>


                    </article>



                    <!-- CROPS -->

                    <article
                        class="statistics-item flex min-h-[190px] flex-col items-center justify-center border-t border-white/25 px-6 py-8 text-center lg:border-r lg:border-t-0"
                        data-target="10"
                        data-display="10">


                        <!-- BIG BOLD WHITE NUMBER -->

                        <div class="text-5xl font-extrabold tracking-tight text-white sm:text-6xl">

                            <span data-counter>0</span><span class="text-white">+</span>

                        </div>


                        <!-- BIG WHITE ICON -->

                        <div class="mt-5">

                            <svg
                                class="stat-icon"
                                viewBox="0 0 48 48"
                                aria-hidden="true">

                                <path d="M24 42V22" />

                                <path d="M24 28c-8 0-13-5-13-13 8 0 13 5 13 13z" />

                                <path d="M24 23c0-9 6-15 15-15 0 9-6 15-15 15z" />

                                <path d="M17 42h14" />

                            </svg>

                        </div>


                        <!-- CLEAN CLASSIC LABEL -->

                        <p class="mt-5 text-lg font-semibold tracking-[0.08em] text-white">
                            Crops
                        </p>


                    </article>



                    <!-- COOPERATIVES -->

                    <article
                        class="statistics-item flex min-h-[190px] flex-col items-center justify-center border-t border-white/25 px-6 py-8 text-center md:border-t-0"
                        data-target="120"
                        data-display="120">


                        <!-- BIG BOLD WHITE NUMBER -->

                        <div class="text-5xl font-extrabold tracking-tight text-white sm:text-6xl">

                            <span data-counter>0</span><span class="text-white">+</span>

                        </div>


                        <!-- BIG WHITE ICON -->

                        <div class="mt-5">

                            <svg
                                class="stat-icon"
                                viewBox="0 0 48 48"
                                aria-hidden="true">

                                <path d="M4 20l8-7 8 4 8-5 16 8" />

                                <path d="M4 20l7 17 9-5 7 6 5-7" />

                                <path d="M44 20l-7 17-9-5" />

                                <path d="M20 17l7 7" />

                                <path d="M27 24l5 5" />

                            </svg>

                        </div>


                        <!-- CLEAN CLASSIC LABEL -->

                        <p class="mt-5 text-lg font-semibold tracking-[0.08em] text-white">
                            Cooperatives
                        </p>


                    </article>


                </div>

            </div>

        </div>

    </section>



    <!-- COUNTER ANIMATION -->

    <script>

        const statistics =
            document.querySelector('[data-statistics]');


        const items =
            document.querySelectorAll('.statistics-item');


        const prefersReducedMotion =
            window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            ).matches;



        function animateCounter(item) {

            const counter =
                item.querySelector('[data-counter]');


            const target =
                Number(item.dataset.target);


            const display =
                item.dataset.display || target;


            if (prefersReducedMotion) {

                counter.textContent = display;

                return;

            }


            const startTime =
                performance.now();


            const duration = 1400;


            function updateCounter(currentTime) {

                const progress =
                    Math.min(
                        (currentTime - startTime) / duration,
                        1
                    );


                const easedProgress =
                    1 - Math.pow(1 - progress, 3);


                counter.textContent =
                    Math.floor(
                        target * easedProgress
                    ).toLocaleString();


                if (progress < 1) {

                    requestAnimationFrame(
                        updateCounter
                    );

                } else {

                    counter.textContent = display;

                }

            }


            requestAnimationFrame(
                updateCounter
            );

        }



        const observer =
            new IntersectionObserver(

                (entries, currentObserver) => {

                    entries.forEach(entry => {

                        if (!entry.isIntersecting)
                            return;


                        items.forEach(item => {

                            item.classList.add(
                                'is-visible'
                            );

                            animateCounter(item);

                        });


                        currentObserver.unobserve(
                            entry.target
                        );

                    });

                },

                {
                    threshold: 0.25
                }

            );


        observer.observe(statistics);

    </script>


</body>

</html>
