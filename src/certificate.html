<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Clients</title>
    <link href="./output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <!-- <style>
        .font-serif-display { font-family: 'Fraunces', serif; }
        .font-sans-body { font-family: 'Inter', sans-serif; }
    </style> -->
</head>

<body class="">

<section class="bg-gray-400 px-8 sm:px-10 lg:px-18 py-16 lg:py-24 text-center">
    <div class="max-w-6xl mx-auto text-center">

        <!-- Heading -->
        <div class="max-w-xl mx-auto mb-12 lg:mb-16">
            <h2 class="text-3xl sm:text-4xl text-[#14261e]">
                certificates <span class="text-yellow-400">and Awards</span>
            </h2>
            <p class="mt-4 text-[15px] sm:text-base text-[#5c6660]">
                Every credential behind our work, on record with Tanzania's registration
                and revenue authorities.
            </p>
        </div>

        <!-- Gallery -->
        <div class="!px-4 sm:!px-6">

            <!-- Row 1: Business License | ICA | Hati ya Shukrani -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 sm:gap-7 mb-5 sm:mb-7">

                <!-- Business License -->
                <figure class="flex flex-col">
                    <div class="aspect-[3/4] overflow-hidden bg-[#f4f5f3] border border-[#e2e5e1] p-2">
                        <img src="./resource/gallery/business license.png.jpeg"
                             alt="Business License"
                             class="w-full h-full object-contain">
                    </div>
                    <figcaption class="mt-3 text-center text-[13px] sm:text-sm text-[#33392f]">
                        Business License
                    </figcaption>
                </figure>

                <!-- ICA -->
                <figure>
                    <div class="h-48 sm:h-64 overflow-hidden bg-[#f4f5f3] border border-[#e2e5e1] p-2">
                        <img src="./resource/gallery/ica.png.jpeg"
                             alt="ICA"
                             class="w-full h-full object-contain">
                    </div>
                    <figcaption class="mt-3 text-center text-[13px] sm:text-sm text-[#33392f]">
                        ICA
                    </figcaption>
                </figure>

                <!-- Hati ya Shukrani -->
                <figure class="flex flex-col">
                    <div class="aspect-[3/4] overflow-hidden bg-[#f4f5f3] border border-[#e2e5e1] p-2">
                        <img src="./resource/gallery/hati ya shukrani.png.jpeg"
                             alt="Hati ya Shukrani"
                             class="w-full h-full object-contain">
                    </div>
                    <figcaption class="mt-3 text-center text-[13px] sm:text-sm text-[#33392f]">
                        Hati ya Shukrani
                    </figcaption>
                </figure>

            </div>

            <!-- Row 2: Incorporate | TCDC | TRA -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 sm:gap-7">

                <figure>
                    <div class="aspect-[3/4] overflow-hidden bg-[#f4f5f3] border border-[#e2e5e1] p-2">
                        <img src="./resource/gallery/incoporate.png.jpeg"
                             alt="Incorporate"
                             class="w-full h-full object-contain">
                    </div>
                    <figcaption class="mt-3 text-center text-[13px] sm:text-sm text-[#33392f]">
                        Certificate of Incorporation
                    </figcaption>
                </figure>

                <figure>
                    <div class="aspect-[3/4] overflow-hidden bg-[#f4f5f3] border border-[#e2e5e1] p-2">
                        <img src="./resource/gallery/tcdc.png.jpeg"
                             alt="TCDC"
                             class="w-full h-full object-contain">
                    </div>
                    <figcaption class="mt-3 text-center text-[13px] sm:text-sm text-[#33392f]">
                        TCDC
                    </figcaption>
                </figure>

                <figure>
                    <div class="aspect-[3/4] overflow-hidden bg-[#f4f5f3] border border-[#e2e5e1] p-2">
                        <img src="./resource/gallery/tra.png.jpeg"
                             alt="TRA"
                             class="w-full h-full object-contain">
                    </div>
                    <figcaption class="mt-3 text-center text-[13px] sm:text-sm text-[#33392f]">
                        TRA
                    </figcaption>
                </figure>

            </div>

            <!-- Shukrani Certificate, centered below both rows -->
            <div class="flex justify-center mt-5 sm:mt-7">
                <figure class="w-full max-w-xs sm:max-w-sm">
                    <div class="h-64 sm:h-72 overflow-hidden bg-[#f4f5f3] border border-[#e2e5e1] p-2">
                        <img src="./resource/gallery/shukrani certfc.png.jpeg"
                             alt="Shukrani Certificate"
                             class="w-full h-full object-contain">
                    </div>
                    <figcaption class="mt-3 text-center text-[13px] sm:text-sm text-[#33392f]">
                        Shukrani Certificate
                    </figcaption>
                </figure>
            </div>

        </div>
    </div>
</section>

</body>
</html>
